<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEU CAMINHO DO MAR 🎓</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        #chat-container { 
            width: 380px; 
            height: 600px; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* CABEÇALHO COM LOGO */
        #header { 
            background: #0084ff; 
            color: white; 
            padding: 15px; 
            text-align: center; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #logo { 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            background: white; 
            padding: 5px; 
            object-fit: contain;
        }

        #header-text {
            font-weight: bold; 
            font-size: 18px;
        }

        #messages { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background-color: #f9f9f9;
        }

        /* ESTRUTURA DE MENSAGEM COM AVATAR */
        .msg-wrapper { 
            display: flex; 
            align-items: flex-end; 
            gap: 8px; 
            max-width: 85%;
        }

        .bot-wrapper { align-self: flex-start; }
        .user-wrapper { align-self: flex-end; flex-direction: row-reverse; }

        .avatar { 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            object-fit: cover; 
        }

        .msg { 
            padding: 10px 15px; 
            border-radius: 15px; 
            font-size: 15px; 
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user { 
            background: #0084ff; 
            color: white; 
            border-bottom-right-radius: 2px;
        }

        .bot { 
            background: #e4e6eb; 
            color: #333; 
            border-bottom-left-radius: 2px;
        }

        #input-area { 
            display: flex; 
            padding: 15px; 
            border-top: 1px solid #eee; 
            background: white;
        }

        input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 25px; 
            outline: none; 
            font-size: 15px;
        }

        button { 
            margin-left: 10px; 
            padding: 10px 20px; 
            background: #0084ff; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover { background: #0066cc; }
        
        /* Ajuste da tabela dentro da mensagem */
        .msg table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">
        <!-- TROQUE 'logo.png' pelo nome do seu arquivo de logo -->
        <img src="logo_branco_sem_fundo.png" alt="Logo Escola" id="logo">
        <div id="header-text">Assistente Virtual do CCM 🎓</div>
    </div>
    <div id="messages">
        <!-- Mensagem Inicial com Avatar -->
        <div class="msg-wrapper bot-wrapper">
            <img src="MARINA AVATAR.png" class="avatar" alt="Bot">
            <div class="msg bot">Olá! Sou a Marina, asisstente virtual do CEU Caminho do Mar. Como posso te ajudar hoje?</div>
        </div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Digite sua dúvida...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('user-input');
    const msgDiv = document.getElementById('messages');
    const userText = input.value.trim();

    if (userText === "") return;

    // Limpa o campo de input imediatamente
    input.value = "";

    // Função auxiliar para criar o HTML da mensagem com segurança
    function createMessageHTML(text, type) {
        const isBot = type === 'bot';
        return `
            <div class="msg-wrapper ${isBot ? 'bot-wrapper' : 'user-wrapper'}">
                ${isBot ? `<img src="avatar.png" class="avatar" alt="Bot">` : ''}
                <div class="msg ${type}">${text}</div>
                ${!isBot ? `<img src="https://cdn-icons-png.flaticon.com/512/1144/1144760.png" class="avatar" alt="User">` : ''}
            </div>`;
    }

    // 1. Adiciona mensagem do USUÁRIO
    msgDiv.insertAdjacentHTML('beforeend', createMessageHTML(userText, 'user'));
    msgDiv.scrollTop = msgDiv.scrollHeight;

    try {
        const RENDER_URL = 'https://chatbotccm.onrender.com'; // <-- COLOQUE SEU LINK

        const response = await fetch(RENDER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mensagem: userText })
        });

        const data = await response.json();
        
        // 2. Adiciona resposta do BOT
        msgDiv.insertAdjacentHTML('beforeend', createMessageHTML(data.resposta, 'bot'));
        
    } catch (error) {
        msgDiv.insertAdjacentHTML('beforeend', createMessageHTML("Ops! O servidor está acordando ou houve um erro.", 'bot'));
    }

    msgDiv.scrollTop = msgDiv.scrollHeight;
}

    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { sendMessage(); }
    });
</script>

</body>
</html>
