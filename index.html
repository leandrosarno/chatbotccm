<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCM 🎓</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 380px; height: 600px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #header { background: #0084ff; color: white; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #logo { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 5px; object-fit: contain; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-color: #f9f9f9; }
        
        /* ESTRUTURA ROBUSTA PARA O AVATAR */
        .msg-wrapper { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; margin-bottom: 10px; }
        .bot-wrapper { align-self: flex-start; flex-direction: row; }
        .user-wrapper { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        
        .msg { padding: 10px 15px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .user { background: #0084ff; color: white; border-bottom-right-radius: 2px; }
        .bot { background: #e4e6eb; color: #333; border-bottom-left-radius: 2px; }

        /* ÁREA DE BOTÕES */
        #menu-options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px; background: #f9f9f9; }
        .btn-option { background: white; border: 1px solid #0084ff; color: #0084ff; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .btn-option:hover { background: #0084ff; color: white; }

        #input-area { display: flex; padding: 15px; border-top: 1px solid #eee; background: white; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        button { margin-left: 10px; padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .msg table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">
        <img src="logo_branco_sem_fundo.png" alt="Logo" id="logo">
        <div style="font-weight: bold;">Assistente do CCM 🎓</div>
    </div>
    <div id="messages"></div>
    <div id="menu-options">
        <button class="btn-option" onclick="sendOption('atividades')">📚 Atividades</button>
        <button class="btn-option" onclick="sendOption('secretaria')">🏢 Secretaria/FAQ</button>
        <button class="btn-option" onclick="sendOption('telefone')">📞 Telefone</button>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Digite sua dúvida...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    const msgDiv = document.getElementById('messages');
    const RENDER_URL = 'https://chatbotccm.onrender.com/chat';

    // FUNÇÃO PARA ADICIONAR MENSAGEM SEM QUEBRAR O HTML
    function appendMessage(text, type) {
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${type === 'bot' ? 'bot-wrapper' : 'user-wrapper'}`;

        if (type === 'bot') {
            const img = document.createElement('img');
            img.src = 'MARINA AVATAR.png'; // Caminho da sua imagem no GitHub
            img.className = 'avatar';
            wrapper.appendChild(img);
        }

        const msg = document.createElement('div');
        msg.className = `msg ${type}`;
        msg.innerHTML = text; //Permite HTML como a tabela
        wrapper.appendChild(msg);

        if (type === 'user') {
            const img = document.createElement('img');
            img.src = 'https://cdn-icons-png.flaticon.com/512/1144/1144760.png';
            img.className = 'avatar';
            wrapper.appendChild(img);
        }

        msgDiv.appendChild(wrapper);
        msgDiv.scrollTop = msgDiv.scrollHeight;
    }

    // Função para os botões de opção
    function sendOption(option) {
        document.getElementById('user-input').value = option;
        sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = "";

        try {
            const response = await fetch(RENDER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensagem: text })
            });
            const data = await response.json();
            appendMessage(data.resposta, 'bot');
        } catch (e) {
            appendMessage("Ops! Servidor offline ou acordando...", 'bot');
        }
    }

    // Início automático
    window.onload = () => {
        appendMessage("Olá! Bem-vindo ao Assistente do CCM. Como posso te ajudar? Use as opções abaixo!", 'bot');
    };
</script>

</body>
</html>
