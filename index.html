<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Escolar 🎓</title>
    <style>
        /* Estilos para deixar o chat bonito e moderno */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        #chat-container { 
            width: 380px; 
            height: 550px; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        #header { 
            background: #0084ff; 
            color: white; 
            padding: 20px; 
            font-weight: bold; 
            text-align: center; 
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #messages { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background-color: #f9f9f9;
        }

        .msg { 
            padding: 10px 15px; 
            border-radius: 15px; 
            max-width: 80%; 
            font-size: 15px; 
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .msg table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .user { 
            background: #0084ff; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px;
        }

        .bot { 
            background: #e4e6eb; 
            color: #333; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px;
        }

        #input-area { 
            display: flex; 
            padding: 15px; 
            border-top: 1px solid #eee; 
            background: white;
        }

        input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 25px; 
            outline: none; 
            font-size: 15px;
        }

        button { 
            margin-left: 10px; 
            padding: 10px 20px; 
            background: #0084ff; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover { 
            background: #0066cc; 
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">Assistente da Escola 🎓</div>
    <div id="messages">
        <div class="msg bot">Olá! Sou o assistente virtual da escola. .Como posso te ajudar hoje?</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Digite sua dúvida...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const msgDiv = document.getElementById('messages');
        const userText = input.value.trim();

        if (userText === "") return;

        // 1. Mostra a mensagem do usuário na tela
        msgDiv.innerHTML += `<div class="msg user">${userText}</div>`;
        input.value = ""; // Limpa o campo de digitação
        
        // Rola para baixo automaticamente
        msgDiv.scrollTop = msgDiv.scrollHeight;

        try {
            // 🚀 ATENÇÃO
            const RENDER_URL = 'https://chatbotccm.onrender.com';

            const response = await fetch(RENDER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensagem: userText })
            });

            if (!response.ok) {
                throw new Error('Erro na resposta do servidor');
            }

            const data = await response.json();
            
            // 2. Mostra a resposta do bot na tela
            msgDiv.innerHTML += `<div class="msg bot">${data.resposta}</div>`;
            
        } catch (error) {
            msgDiv.innerHTML += `<div class="msg bot">Ops! O servidor está acordando ou houve um erro. Tente novamente em alguns segundos.</div>`;
            console.error("Erro:", error);
        }

        // Rola para baixo novamente após a resposta do bot
        msgDiv.scrollTop = msgDiv.scrollHeight;
    }

    // Permite enviar a mensagem apertando a tecla "Enter"
    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
